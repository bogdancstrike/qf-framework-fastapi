[project]
name = "qf-fastapi"
version = "2.0.0"
description = "FastAPI and asyncio Kafka ETL framework"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "aiokafka>=0.12,<0.14", "redis>=5.2,<7",
  "prometheus-client>=0.21,<1", "tenacity>=9,<10", "limits>=4,<6",
  "opentelemetry-api>=1.30,<2",
]
[project.optional-dependencies]
tracing = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2", "opentelemetry-instrumentation-fastapi>=0.51b0,<1"]
dev = ["opentelemetry-sdk>=1.30,<2", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "fakeredis[lua]>=2.28,<3", "ruff>=0.9,<1", "build>=1.2,<2", "psutil>=6,<8"]
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/framework"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live Kafka and Redis", "chaos: explicitly pauses the dedicated test broker"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"src/framework/commons/apdu_utils.py" = ["F403", "F405", "F811"]
"src/framework/commons/hex.py" = ["E741"]
"src/framework/commons/utils.py" = ["E741"]
"benchmarks/*.py" = ["E402"]
