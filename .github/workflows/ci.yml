name: validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev,tracing]'
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: docker compose -p qf-fastapi-test up -d --wait
      - run: QF_INTEGRATION=1 python -m pytest tests/test_e2e.py -v
      - if: always()
        run: docker compose -p qf-fastapi-test down -v
